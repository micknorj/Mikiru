name: Mikiru GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mikiru-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Require public API configuration
        env:
          VITE_API_BASE_URL: ${{ vars.MIKIRU_API_BASE_URL }}
        run: test -n "$VITE_API_BASE_URL"
      - run: npm ci
      - run: npm run check
        env:
          VITE_API_BASE_URL: ${{ vars.MIKIRU_API_BASE_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/frontend
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved main build
        id: deployment
        uses: actions/deploy-pages@v5
